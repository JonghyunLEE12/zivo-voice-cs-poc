- id: en-01
  locale: en
  text: Hello, this is ZIVO customer support. How can I help you today?
- id: en-02
  locale: en
  text: I found your booking. Your reservation number is ZV-4821, at Hanbit Stay Myeongdong.
- id: en-03
  locale: en
  text: You check in on Tuesday, November 3rd, for two nights, and the total is ₩286,000.
- id: en-04
  locale: en
  text: Free cancellation ended on October 31st, so a 50% fee of ₩143,000 applies until November 2nd.
- id: en-05
  locale: en
  text: From Incheon Airport, take AREX to Seoul Station, then Line 4 to Myeongdong Station.
- id: en-06
  locale: en
  text: Your driver will drop you at Euljiro Lantern Hotel, near Exit 10 of Euljiro 3-ga Station.
- id: en-07
  locale: en
  text: I'm so sorry for the trouble. Let me check that for you right away.
- id: en-08
  locale: en
  text: I'll connect you with a human agent now. Please stay on the line.
- id: zh-CN-01
  locale: zh-CN
  text: 您好，这里是ZIVO客服中心，请问有什么可以帮您？
- id: zh-CN-02
  locale: zh-CN
  text: 已经查到您的预订，预订号ZV-7305，11月7日晚上19:30从仁川国际机场出发。
- id: zh-CN-03
  locale: zh-CN
  text: 车费是78,000韩元，已经用信用卡付款了。
- id: zh-CN-04
  locale: zh-CN
  text: 接送开始前24小时以内取消的话，需要支付50%的费用。
- id: zh-CN-05
  locale: zh-CN
  text: 司机会在第1航站楼3号出口等您，然后送您到乙支路灯笼酒店。
- id: zh-CN-06
  locale: zh-CN
  text: 酒店离乙支路3街站10号出口走路大约3分钟。
- id: zh-CN-07
  locale: zh-CN
  text: 给您带来不便，真的非常抱歉，我马上帮您确认。
- id: zh-CN-08
  locale: zh-CN
  text: 我现在为您转接人工客服，请稍等，不要挂断电话。
- id: zh-TW-01
  locale: zh-TW
  text: 您好，這裡是ZIVO客服中心，請問有什麼可以幫您的嗎？
- id: zh-TW-02
  locale: zh-TW
  text: 已經查到您的訂房，訂單編號ZV-5196，11月10日入住漢江月光套房飯店。
- id: zh-TW-03
  locale: zh-TW
  text: 兩晚的總金額是412,000韓元，已經用信用卡付款了。
- id: zh-TW-04
  locale: zh-TW
  text: 11月7日以前取消都可以免費，之後要收取50%的手續費。
- id: zh-TW-05
  locale: zh-TW
  text: 從仁川國際機場搭機場捷運到首爾站，再轉搭地鐵4號線到明洞站。
- id: zh-TW-06
  locale: zh-TW
  text: 飯店就在弘大入口站附近，走路大約5分鐘。
- id: zh-TW-07
  locale: zh-TW
  text: 造成您的不便，真的很抱歉，我馬上幫您確認。
- id: zh-TW-08
  locale: zh-TW
  text: 我現在幫您轉接真人客服，請稍候，不要掛斷電話喔。
- id: ja-01
  locale: ja
  text: お問い合わせありがとうございます。ZIVOカスタマーサポートです。
- id: ja-02
  locale: ja
  text: ご予約を確認しました。予約番号ZV-2610、11月5日午前10時の景福宮韓服体験ツアーですね。
- id: ja-03
  locale: ja
  text: お二人分で合計130,000ウォン、クレジットカードでお支払い済みです。
- id: ja-04
  locale: ja
  text: 11月3日までは無料でキャンセルできますが、それ以降は全額のキャンセル料がかかります。
- id: ja-05
  locale: ja
  text: 集合場所は景福宮駅の5番出口です。
- id: ja-06
  locale: ja
  text: 明洞駅から地下鉄4号線で忠武路駅まで行き、3号線に乗り換えて景福宮駅で降りてください。
- id: ja-07
  locale: ja
  text: ご不便をおかけして、大変申し訳ございません。すぐに確認いたします。
- id: ja-08
  locale: ja
  text: ただいま担当者におつなぎします。このまま少々お待ちください。
- id: yue-01
  locale: yue
  text: 你好，呢度係ZIVO客服，有咩可以幫到你？
- id: yue-02
  locale: yue
  text: 你嘅訂單編號係ZV-9034，十一月二十號入住明洞韓光酒店。
- id: yue-03
  locale: yue
  text: 我而家幫你轉接真人客服，唔該等一等。
