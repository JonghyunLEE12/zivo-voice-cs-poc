[project]
name = "zivo-mlx-engines"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-audio>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "soundfile>=0.13",
    "scipy>=1.12",
    "psutil>=6",
    "misaki[en,ja,zh]>=0.9",
    "unidic>=1.1",
    "opencc-python-reimplemented>=0.1.7",
    "en-core-web-sm",
]
[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
