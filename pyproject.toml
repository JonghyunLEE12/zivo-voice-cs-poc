[project]
name = "zivo-voice-cs-poc"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "huggingface-hub>=0.30,<1",
    "numpy>=1.26",
    "soundfile>=0.13",
    "pyyaml>=6",
    "jinja2>=3.1",
    "opencc-python-reimplemented>=0.1.7",
    "num2words>=0.5.14",
    "cn2an>=0.5.23",
    "psutil>=6",
    "mlx-whisper>=0.4",
    "onnxruntime>=1.20",
    "transformers>=4.48,<5",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]
[tool.uv]
package = false
[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
