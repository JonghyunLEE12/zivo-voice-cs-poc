<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>음성 블라인드 비교</title><link rel="stylesheet" href="./style.css">
<main><header><p class="eyebrow">ZIVO · LISTENING LAB</p><h1>어떤 목소리가 더 자연스러운가요?</h1><p>같은 문장을 두 번 듣고 비교해 주세요. 음성의 순서는 매번 무작위입니다.</p><a href="/blind/results">집계 보기 ↗</a></header>
<section id="profile"><h2>청취자 정보</h2><form id="profile-form"><label>별칭<input id="alias" required maxlength="60" autocomplete="nickname"></label><label>모국어<select id="native"><option value="en">English</option><option value="zh-CN">中文 · 中国大陆</option><option value="zh-TW">中文 · 台灣</option><option value="ja">日本語</option><option value="yue">廣東話</option><option value="ko" selected>한국어</option><option value="other">기타</option></select></label><label>청취 장치<select id="device"><option value="headphones">헤드폰 / 이어폰</option><option value="speakers">스피커</option></select></label><button type="submit">비교 시작</button></form></section>
<section id="evaluation" hidden><label>평가 언어<select id="locale"><option value="en">English</option><option value="zh-CN">中文 · 中国大陆</option><option value="zh-TW">中文 · 台灣</option><option value="ja">日本語</option><option value="yue">廣東話</option></select></label><blockquote id="sentence"></blockquote><div class="clips"><button id="play-a" type="button">▶ A 듣기</button><button id="play-b" type="button">▶ B 듣기</button></div><p id="listen-status">두 음성을 끝까지 들으면 투표할 수 있습니다.</p><form id="vote-form"><fieldset id="vote-fields" disabled><legend>자연스러움</legend><div class="choices"><label><input type="radio" name="choice" value="A" required>A가 더 자연스러움</label><label><input type="radio" name="choice" value="same">차이 없음</label><label><input type="radio" name="choice" value="B">B가 더 자연스러움</label></div><div class="checks"><label><input type="checkbox" id="issue-a">A 발음 오류</label><label><input type="checkbox" id="issue-b">B 발음 오류</label></div><label>메모 (선택)<textarea id="comment" maxlength="1000" rows="3"></textarea></label><button type="submit">저장하고 다음 문장</button></fieldset></form></section><p id="status" role="status" aria-live="polite"></p><footer>헤드폰 청취 권장 · 평가는 익명 음성 번호로 집계합니다. 별칭과 응답은 이 로컬 서버에 저장됩니다.</footer></main><script type="module" src="./listen.ts"></script></html>
